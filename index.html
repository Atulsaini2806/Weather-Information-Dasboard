<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Information Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

     <!-- Dark Mode Button -->
        <button id="darkModeBtn">🌙 Dark Mode</button>

    <div class="container">

        <h1>Weather Information Dashboard</h1>

        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name"
            >
            <button id="searchBtn">Search</button>
        </div>

        <div id="loading"></div>
        <p id="error"></p>

        <div id="weatherCard" class="weather-card">

            <h2 id="cityName">City</h2>

            <img id="weatherIcon" src="" alt="Weather Icon">

            <h3 id="temperature">--°C</h3>

            <p id="condition">Condition</p>

            <div class="details">
                <p>💧 Humidity: <span id="humidity">--</span>%</p>
                <p>💨 Wind Speed: <span id="windSpeed">--</span> km/h</p>
            </div>

        </div>
    </div>

    <div id="forecastContainer">
        <h2>5-Day Forecast</h2>
        <div id="forecastCards"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
